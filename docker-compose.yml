services:
  db:
    image: postgres:16-alpine
    container_name: sistema-usuarios-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: SpringDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pedro1995
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SpringDB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    container_name: sistema-usuarios-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: